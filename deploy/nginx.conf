server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # ───── Security headers (per pentest report) ─────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  # CSP — inline allowed for Vite-built scripts; Google Fonts allowed.
  # gstatic.com is whitelisted in script-src / connect-src so the
  # iframed Flutter Web demo (MAGUS) can load its canvaskit runtime
  # and embedded Roboto font from Google's CDN.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self'; worker-src 'self' blob:; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # ───── Compression ─────
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/wasm image/svg+xml font/ttf font/woff font/woff2;

  # ───── Healthcheck ─────
  location = /healthz {
    access_log off;
    add_header Content-Type "text/plain";
    return 200 "ok\n";
  }

  # ───── Iframed sub-apps (Flutter, BEACON WP, Beacon Enterprise, CodeWitness, PGP) ─────
  # These are independent SPAs — no SPA-fallback for them, just static assets.
  # Flutter app needs the `Service-Worker-Allowed` style scope; not strictly required since we
  # disabled SW registration in our auth-bypass shim, but keep proper MIME for .wasm/.dat.
  location ~ ^/(magus-app|wp-planner-app|beacon-app|codewitness-app|pgp-app)/ {
    try_files $uri =404;
    # Long-term cache for hashed assets, short for HTML
    location ~ \.html$ {
      add_header Cache-Control "no-cache" always;
    }
    location ~ \.(js|css|wasm|png|jpg|jpeg|svg|woff2?|ttf|json|map)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
  }

  # ───── Beacon screenshots / portrait / static images ─────
  location ~ ^/(beacon-shots|logos)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  # ───── Hashed Vite asset bundles (portfolio shell) ─────
  location ~ ^/assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # ───── Top-level static assets (favicon, portrait.jpg, .geojson, etc.) ─────
  location ~ \.(svg|jpg|jpeg|png|json|geojson|ico|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
  }

  # ───── SPA fallback — root index.html ─────
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Don't serve dotfiles
  location ~ /\. { deny all; }
}
