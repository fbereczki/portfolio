# Bereczki Ferenc — apex imwy.ai (company landing: Mimir · CodeWitness · Beacon)
# Replaces the 2026-05-29 redirect-to-portfolio vhost. Original pre-portfolio
# vhost remains at /etc/nginx/sites-available/imwy.ai.bak.preportfolio;
# the redirect-era vhost is backed up as imwy.ai.bak.redirect at deploy time.
# Proxies to the portfolio container (127.0.0.1:9080) which serves the landing
# for Host: imwy.ai / www.imwy.ai and the portfolio for portfolio.imwy.ai.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name imwy.ai www.imwy.ai;

    ssl_certificate     /etc/letsencrypt/live/imwy.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imwy.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    real_ip_header CF-Connecting-IP;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name imwy.ai www.imwy.ai;
    return 301 https://$host$request_uri;
}
