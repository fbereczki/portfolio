<!DOCTYPE html>
<html>
<head>
    <title>Beacon - Auto Fix Authentication</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
            text-align: center;
        }
        .status {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            min-height: 200px;
        }
        .step {
            padding: 10px 0;
            display: flex;
            align-items: center;
        }
        .step-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            font-size: 20px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .loading { color: #fbbf24; }
        button {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Beacon Authentication Fix</h1>
        <div class="status" id="status"></div>
        <button id="fixButton" onclick="autoFix()">Fix Authentication Now</button>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/v1';
        const statusDiv = document.getElementById('status');
        const fixButton = document.getElementById('fixButton');

        function addStep(icon, message, className) {
            const step = document.createElement('div');
            step.className = 'step';
            step.innerHTML = `
                <span class="step-icon ${className}">${icon}</span>
                <span>${message}</span>
            `;
            statusDiv.appendChild(step);
        }

        async function autoFix() {
            fixButton.disabled = true;
            statusDiv.innerHTML = '';

            try {
                // Step 1: Clear old data
                addStep('🧹', 'Clearing old authentication data...', 'loading');
                localStorage.clear();
                await new Promise(resolve => setTimeout(resolve, 500));
                addStep('✅', 'Old data cleared', 'success');

                // Step 2: Login
                addStep('🔐', 'Logging in as admin...', 'loading');
                const loginResponse = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@beacon.local',
                        password: 'admin123'
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error(`Login failed: ${loginResponse.status}`);
                }

                const loginData = await loginResponse.json();
                if (!loginData.token) {
                    throw new Error('No token received from login');
                }

                localStorage.setItem('token', loginData.token);
                localStorage.setItem('user', JSON.stringify(loginData.user));
                addStep('✅', 'Login successful!', 'success');

                // Step 3: Get tenants
                addStep('🏢', 'Fetching tenants...', 'loading');
                const tenantsResponse = await fetch(`${API_BASE}/tenants`, {
                    headers: {
                        'Authorization': `Bearer ${loginData.token}`
                    }
                });

                if (!tenantsResponse.ok) {
                    throw new Error(`Failed to fetch tenants: ${tenantsResponse.status}`);
                }

                const tenantsData = await tenantsResponse.json();
                if (!tenantsData.tenants || tenantsData.tenants.length === 0) {
                    throw new Error('No tenants found');
                }

                const cybersecTenant = tenantsData.tenants.find(t => t.name === 'Cybersecurity') || tenantsData.tenants[0];
                addStep('✅', `Found tenant: ${cybersecTenant.name}`, 'success');

                // Step 4: Switch tenant
                addStep('🔄', 'Switching to tenant...', 'loading');
                const switchResponse = await fetch(`${API_BASE}/tenant/switch/${cybersecTenant.tenant_id}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${loginData.token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!switchResponse.ok) {
                    throw new Error(`Failed to switch tenant: ${switchResponse.status}`);
                }

                localStorage.setItem('currentTenantId', cybersecTenant.tenant_id);
                addStep('✅', 'Tenant switched successfully!', 'success');

                // Step 5: Redirect
                addStep('🚀', 'Redirecting to application...', 'success');
                await new Promise(resolve => setTimeout(resolve, 1000));
                window.location.href = '/';

            } catch (error) {
                addStep('❌', `Error: ${error.message}`, 'error');
                fixButton.disabled = false;
            }
        }

        // Auto-start on load
        window.addEventListener('load', () => {
            setTimeout(autoFix, 500);
        });
    </script>
</body>
</html>
