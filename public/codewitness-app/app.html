    <!--
      PL-365 — Content-Security-Policy (defense-in-depth meta header).
      Production deployments MUST also send the same CSP via a server
      response header so the directives apply to non-document responses
      (XHR, beacon). Meta CSP only covers the SPA shell loaded from this
      HTML file but is sufficient for SPA-served paths.

      Notes on each directive:
      - default-src 'self': everything not enumerated must be same-origin.
      - script-src 'self': no inline scripts, no eval, no CDNs. Vite
        emits all JS as same-origin chunks under /assets/, so this works
        out of the box.
      - style-src 'self' 'unsafe-inline': MUI / emotion inject runtime
        styles via <style> tags; until we ship hashed styles this stays.
        (Not a hard XSS vector on its own without script-src 'unsafe-inline'.)
      - connect-src: backend API + WS. The protocol/host pair is static
        per-deployment but we keep both http(s) + ws(s) for the dev
        bootstrap script which writes a custom hub URL.
      - img-src: data: for embedded SVG icons + blob: for screenshot uploads.
      - object-src 'none': blocks <object>/<embed> (Flash relics, PDF
        inline plugins).
      - base-uri 'self': prevents <base href="evil.com"> rebasing.
      - frame-ancestors 'none': clickjacking guard — same as
        X-Frame-Options: DENY but with the modern directive.
      - form-action 'self': forms must POST to same-origin only.
      - upgrade-insecure-requests: any http:// resource referenced is
        upgraded to https:// at request-time.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    />
    <!--
      Referrer-Policy hardening — strip Referer on cross-origin nav so
      tokens that still travel via ?token= URLs (verify-email, invite/
      accept) do not leak into third-party analytics. The backend also
      sets Referrer-Policy in its response headers; this meta tag is a
      belt-and-braces guard for the SPA shell.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
