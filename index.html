<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferenc Bereczki — Cybersecurity Expert &amp; PM · AI Builder · founder of imwy.ai</title>
    <meta name="description" content="Witness file of Ferenc Bereczki, the engineer behind imwy.ai — cybersecurity project leadership (ISO 21434, UN-ECE R155/156), national-scale R&amp;D programmes, AI-assisted engineering under expert control, and the evidence to prove it." />
    <meta name="theme-color" content="#0c0e12" />
    <link rel="preload" href="/fonts/Sora.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Pre-hydration theme pick — same 'imwy_theme' key as imwy.ai, so the
      // choice follows the visitor across the two sites without a flash.
      try {
        var t = localStorage.getItem('imwy_theme');
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) { /* storage unavailable — stay dark */ }
    </script>
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
